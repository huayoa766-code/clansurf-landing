<!DOCTYPE html>
<!-- Source for public/og-home.png (1200x630), the home page's card: the same ground and panel
     as the street card, with many small nodes instead of one street. The nodes are written in by
     scripts/pixel.py; then run: node scripts/og-image.cjs -->

<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#f5c84a;position:relative;font-family:'Archivo',sans-serif}
.street{position:absolute;right:0;top:40px;width:560px;height:590px;overflow:hidden;border-top:4px solid #1f1d26;border-left:4px solid #1f1d26;box-sizing:border-box}
.street svg{display:block;width:556px;height:586px}
.panel{position:absolute;left:44px;top:44px;width:660px;height:542px;background:#183a2b;color:#eef3ee;box-sizing:border-box;padding:44px 48px}
.brand{display:flex;align-items:center;gap:14px;font-weight:750;font-stretch:90%;font-size:30px;letter-spacing:-0.01em}
.brand img{width:48px;height:48px;image-rendering:pixelated;background:#eef3ee;border-radius:4px;padding:3px;box-sizing:border-box}
h1{margin:44px 0 0;font-weight:800;font-stretch:72%;font-size:72px;white-space:nowrap;line-height:0.92;letter-spacing:-0.022em}
h1 span{display:block} h1 em{font-style:normal;color:#f5c84a}
.url{position:absolute;left:52px;bottom:44px;font-stretch:125%;font-weight:650;font-size:19px;letter-spacing:0.05em;color:#f5c84a}
.nodes{position:absolute;left:744px;top:68px;width:412px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 12px}
.nodes svg{display:block;width:100%;height:auto;image-rendering:pixelated}
.px-t{font-family:Archivo;font-weight:750;font-stretch:75%;font-size:3.7px;fill:#4a2f1c}
